name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run eslint

      - name: Type-check
        run: pnpm run typecheck

      # The plugin may use an Obsidian API newer than the minAppVersion of next-release.json only behind
      # requireApiVersion, see apps/obsidian-plugin/scripts/api-floor-check.mjs.
      - name: API floor
        run: pnpm run api-floor

      # Keep private App APIs in tasksplugin.ts with no exceptions and at most one @ts-expect-error comment,
      # see apps/obsidian-plugin/scripts/private-api-check.mjs.
      - name: Private API
        run: pnpm run private-api

      # Pure refactors may change only imports in the frozen write-path tests; the merge commit's first parent is
      # the base tip. See apps/obsidian-plugin/scripts/frozen-tests.mjs.
      - name: Frozen tests
        if: github.event_name == 'pull_request'
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node apps/obsidian-plugin/scripts/frozen-tests.mjs --base HEAD^1

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
