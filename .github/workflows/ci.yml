name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, type-check, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run eslint

      - name: Type-check
        run: pnpm run typecheck

      # The plugin may use an Obsidian API newer than the minAppVersion of next-release.json only behind
      # requireApiVersion, see apps/obsidian-plugin/scripts/api-floor-check.mjs.
      - name: API floor
        run: pnpm run api-floor

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build
