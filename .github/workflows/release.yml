name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

env:
  JSPATH: apps/obsidian-plugin/dist/main.js

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: pnpm

      # Obsidian and BRAT take the version from manifest.json, so a tag that does not match it would ship
      # under the wrong version. A release also needs its versions.json entry, which tells older Obsidian
      # versions which release they can still install.
      - name: Check the tag against manifest.json and versions.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const fail = (message) => { console.error("::error::" + message); process.exit(1); };
            const { version, minAppVersion } = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            if (process.env.TAG !== version) fail(`tag ${process.env.TAG} does not match version ${version} in manifest.json`);
            if (!version.includes("-")) {
              const versions = JSON.parse(fs.readFileSync("versions.json", "utf8"));
              if (versions[version] !== minAppVersion) fail(`versions.json must map ${version} to minAppVersion ${minAppVersion}`);
            }
          '

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run eslint

      - name: Test
        run: pnpm test

      - name: Build
        run: |
          pnpm run build
          cp ${{ env.JSPATH }} main.js
          cp apps/obsidian-plugin/styles.css styles.css

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A tag with a hyphen (0.4.0-beta.1) is a beta for BRAT testers, so publish it as a pre-release.
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --generate-notes $flags
